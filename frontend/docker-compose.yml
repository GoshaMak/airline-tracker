services:
  frontend: &frontend-service
    labels:
      airline_tracker.logs: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend-mirror:
    <<: *frontend-service

networks:
  api:
    external: true
    name: backend_default
