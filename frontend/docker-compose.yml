services:
  frontend: &frontend-service
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend-mirror:
    <<: *frontend-service

networks:
  api:
    external: true
    name: backend_default
