map $status $static_cache_control {
    default "no-store";
    200 "public, max-age=3600";
    206 "public, max-age=3600";
    304 "public, max-age=3600";
}

server {
    listen 8081;
    server_tokens off;

    more_set_headers 'Server: Airline Tracker';
    add_header Cache-Control "no-store" always;

    location = /status {
        access_log off;
        stub_status;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    more_set_headers 'Server: Airline Tracker';

    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "no-store" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css text/plain text/javascript application/javascript
        application/xml image/svg+xml;

    # INFO: Docker DNS: in case when backend nginx not available when frontend starts
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream nginx:80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|ico|webp|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control $static_cache_control always;
    }

    location ^~ /api/ {
        gzip off;
        proxy_pass http://$backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
