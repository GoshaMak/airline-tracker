services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/postgresql/primary-entrypoint.sh"]
    command: ["postgres", "-c", "config_file=/etc/postgresql/primary.conf"]
    environment:
      POSTGRES_DB: airline_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/:/docker-entrypoint-initdb.d
      - ./db/replication/primary-entrypoint.sh:/etc/postgresql/primary-entrypoint.sh:ro
      - ./db/replication/primary.conf:/etc/postgresql/primary.conf:ro
      - ./db/replication/pg_hba.conf:/etc/postgresql/replication_hba.conf:ro
    networks:
      - shared
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d airline_tracker"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s

  postgres-replica-1: &postgres-replica
    image: postgres:16
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/replica.conf"]
    environment:
      POSTGRES_DB: airline_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_replica_1_data:/var/lib/postgresql/data
      - ./db/init/001_roles.sql:/docker-entrypoint-initdb.d/001_roles.sql:ro
      - ./db/replication/replica-roles.sql:/docker-entrypoint-initdb.d/002_replica_roles.sql:ro
      - ./db/replication/replica.conf:/etc/postgresql/replica.conf:ro
      - ./db/replication/pg_hba.conf:/etc/postgresql/replication_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d airline_tracker"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 5s

  postgres-replica-2:
    <<: *postgres-replica
    volumes:
      - postgres_replica_2_data:/var/lib/postgresql/data
      - ./db/init/001_roles.sql:/docker-entrypoint-initdb.d/001_roles.sql:ro
      - ./db/replication/replica-roles.sql:/docker-entrypoint-initdb.d/002_replica_roles.sql:ro
      - ./db/replication/replica.conf:/etc/postgresql/replica.conf:ro
      - ./db/replication/pg_hba.conf:/etc/postgresql/replication_hba.conf:ro

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 2s

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  postgres_replica_1_data:
    driver: local
  postgres_replica_2_data:
    driver: local

networks:
  shared:
    name: shared_postgres
