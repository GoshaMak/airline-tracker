upstream api_read {
    zone api_read 64k;
    server api:8080 weight=2;
    server api-read-1:8080 weight=1;
    server api-read-2:8080 weight=1;
}

upstream api_write {
    server api:8080;
}

map $request_method $api_upstream {
    default api_write;
    GET api_read;
    HEAD api_read;
}

server {
    listen 80;
    server_name localhost;

    absolute_redirect off;

    # INFO: Resolve frontend when handling requests, not when loading the config
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $frontend_upstream frontend:80;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/docs {
        return 301 /api/v1/docs/;
    }

    location ^~ /swagger/ {
        proxy_pass http://api:8080;
    }

    location ^~ /api/v1/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /documentation {
        alias /usr/share/nginx/html/documentation.html;

        default_type text/html;
        charset utf-8;
    }

    location = /documentation.md {
        alias /srv/README.md;

        default_type text/plain;
        charset utf-8;
    }

    location = /legacy {
        return 301 /legacy/;
    }

    location = /legacy/ {
        try_files /legacy.html =404;
    }

    location = /management {
        try_files /management.html =404;
    }

    location = /reserved {
        return 301 /reserved/;
    }

    location ^~ /reserved/ {
        rewrite ^/reserved/(.*)$ /$1 break;

        proxy_pass http://$frontend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        auth_basic "Database administration";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /status {
        auth_basic "Server status";
        auth_basic_user_file /etc/nginx/.htpasswd;

        stub_status;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location = /ready {
        proxy_pass http://api:8080/api/v1/status;
    }

    location / {
        proxy_pass http://$frontend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

