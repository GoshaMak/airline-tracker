server {
    listen 80;
    server_name localhost;

    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/docs {
        return 301 /api/v1/docs/;
    }

    location = /api/v1/docs/ {
        proxy_pass http://api:8080/api/v1/docs/;
        proxy_set_header Host $host;
    }

    location ^~ /swagger/ {
        proxy_pass http://api:8080;
    }

    location ^~ /api/v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /documentation {
        alias /usr/share/nginx/html/documentation.html;

        default_type text/html;
        charset utf-8;
        charset_types text/html;
    }

    location = /documentation.md {
        alias /srv/README.md;

        default_type text/plain;
        charset utf-8;
    }

    location = /legacy {
        return 301 /legacy/;
    }

    location = /legacy/ {
        try_files /legacy.html =404;
    }

    location = /management {
        try_files /management.html =404;
    }

    location = /reserved {
        return 301 /reserved/;
    }

    location ^~ /reserved/ {
        rewrite ^/reserved/(.*)$ /$1 break;

        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        auth_basic "Database administration";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /status {
        auth_basic "Server status";
        auth_basic_user_file /etc/nginx/.htpasswd;

        stub_status;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location = /ready {
        proxy_pass http://api:8080/api/v1/status;
    }

    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

