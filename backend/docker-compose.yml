include:
  - path: ./infra-compose.yml

services:
  api: &api-service
    env_file:
      - ./api/.env
    build:
      context: .
      dockerfile: ./api/Dockerfile
    command: ["/bin/api"]
    environment:
      INSTANCE_ID: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  api-read-1:
    <<: *api-service
    env_file:
      - ./api/.env
      - ./api/read.env
    environment:
      INSTANCE_ID: api-read-1

  api-read-2:
    <<: *api-service
    env_file:
      - ./api/.env
      - ./api/read.env
    environment:
      INSTANCE_ID: api-read-2

  api-publisher:
    env_file:
      - ./api/.env
    build:
      context: .
      dockerfile: ./api/Dockerfile
    command: ["/bin/publisher"]
    environment:
      LOG_FILE: publisher.log
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  api-migrate:
    env_file:
      - ./api/migrate.env
    build:
      context: .
      dockerfile: ./api/Dockerfile
    command: ["/bin/migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  notifier:
    env_file:
      - ./notifier/.env
    build:
      context: .
      dockerfile: ./notifier/Dockerfile
    command: ["/bin/notifier"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      notifier-migrate:
        condition: service_completed_successfully

  notifier-migrate:
    env_file:
      - ./notifier/migrate.env
    build:
      context: .
      dockerfile: ./notifier/Dockerfile
    command: ["/bin/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      api-read-1:
        condition: service_started
      api-read-2:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/airline_tracker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/static:/usr/share/nginx/html:ro
      - ../README.md:/srv/README.md:ro

  adminer:
    image: adminer:6.1.1-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

