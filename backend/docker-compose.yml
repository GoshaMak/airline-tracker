include:
  - path: ./docker-infra.yml

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./cmd
          target: /app/cmd
        - action: sync+restart
          path: ./internal
          target: /app/internal
        - action: sync+restart
          path: ./pkg
          target: /app/pkg
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum
