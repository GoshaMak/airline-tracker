include:
  - path: ./infra-compose.yml
  - path: ./monitoring-compose.yml

x-telemetry-environment: &telemetry-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}

services:
  api: &api-service
    stop_grace_period: 30s
    labels:
      airline_tracker.logs: "true"
    logging: &application-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./api/.env
    build:
      context: .
      dockerfile: ./api/Dockerfile
    command: ["/bin/api"]
    environment: &api-environment
      <<: *telemetry-environment
      INSTANCE_ID: api
      API_REQUEST_TIMEOUT: ${API_REQUEST_TIMEOUT:-10s}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      replication-setup:
        condition: service_completed_successfully

  api-read-1: &api-read-service
    <<: *api-service
    env_file:
      - ./api/.env
      - ./api/replica-1.env
    environment:
      <<: *api-environment
      INSTANCE_ID: api-read-1

  api-read-2:
    <<: *api-service
    env_file:
      - ./api/.env
      - ./api/replica-2.env
    environment:
      <<: *api-environment
      INSTANCE_ID: api-read-2

  api-mirror:
    <<: *api-read-service
    environment:
      <<: *api-environment
      INSTANCE_ID: api-mirror

  api-mirror-read-1:
    <<: *api-read-service
    env_file:
      - ./api/.env
      - ./api/replica-2.env
    environment:
      <<: *api-environment
      INSTANCE_ID: api-mirror-read-1

  api-mirror-read-2:
    <<: *api-read-service
    env_file:
      - ./api/.env
      - ./api/replica-2.env
    environment:
      <<: *api-environment
      INSTANCE_ID: api-mirror-read-2

  api-publisher: &publisher-service
    stop_grace_period: 30s
    labels:
      airline_tracker.logs: "true"
    logging: *application-logging
    env_file:
      - ./api/.env
    build:
      context: .
      dockerfile: ./api/Dockerfile
    command: ["/bin/publisher"]
    environment: &publisher-environment
      <<: *telemetry-environment
      INSTANCE_ID: api-publisher
      LOG_FILE: publisher.log
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
      api-migrate:
        condition: service_completed_successfully
      replication-setup:
        condition: service_completed_successfully

  api-publisher-2:
    <<: *publisher-service
    environment:
      <<: *publisher-environment
      INSTANCE_ID: api-publisher-2

  api-publisher-3:
    <<: *publisher-service
    environment:
      <<: *publisher-environment
      INSTANCE_ID: api-publisher-3

  kafka-setup:
    image: apache/kafka:latest
    env_file:
      - ./api/.env
    volumes:
      - ./kafka/setup-topics.sh:/setup-topics.sh:ro
    entrypoint: ["/bin/sh", "/setup-topics.sh"]
    depends_on:
      kafka:
        condition: service_healthy

  replication-setup:
    image: postgres:16
    env_file:
      - ./db/replication/replication.env
    volumes:
      - ./db/replication:/replication:ro
      - ./api/internal/db/migrations/20261022120000_add_outbox_reliability.sql:/replica-migrations/outbox.sql:ro
      - ./notifier/internal/db/migrations/20261022120000_add_notification_reliability.sql:/replica-migrations/notifications.sql:ro
      - ./notifier/internal/db/migrations/20261022120200_add_inbox_source.sql:/replica-migrations/inbox-source.sql:ro
    entrypoint: ["/bin/sh", "/replication/setup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica-1:
        condition: service_healthy
      postgres-replica-2:
        condition: service_healthy
      notifier-migrate:
        condition: service_completed_successfully

  api-migrate:
    env_file:
      - ./api/migrate.env
    build:
      context: .
      dockerfile: ./api/Dockerfile
    command: ["/bin/migrate"]
    environment:
      PGOPTIONS: "-c synchronous_commit=local"
    depends_on:
      postgres:
        condition: service_healthy

  notifier: &notifier-service
    stop_grace_period: 30s
    labels:
      airline_tracker.logs: "true"
    logging: *application-logging
    env_file:
      - ./notifier/.env
    build:
      context: .
      dockerfile: ./notifier/Dockerfile
    command: ["/bin/notifier"]
    restart: unless-stopped
    environment: &notifier-environment
      <<: *telemetry-environment
      INSTANCE_ID: notifier
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
      notifier-migrate:
        condition: service_completed_successfully
      replication-setup:
        condition: service_completed_successfully

  notifier-2:
    <<: *notifier-service
    environment:
      <<: *notifier-environment
      INSTANCE_ID: notifier-2

  notifier-3:
    <<: *notifier-service
    environment:
      <<: *notifier-environment
      INSTANCE_ID: notifier-3

  notifier-migrate:
    env_file:
      - ./notifier/migrate.env
    build:
      context: .
      dockerfile: ./notifier/Dockerfile
    command: ["/bin/migrate"]
    environment:
      PGOPTIONS: "-c synchronous_commit=local"
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  nginx:
    labels:
      airline_tracker.logs: "true"
    logging: *application-logging
    image: openresty/openresty:1.29.2.4-1-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      api-read-1:
        condition: service_started
      api-read-2:
        condition: service_started
      api-mirror:
        condition: service_started
      api-mirror-read-1:
        condition: service_started
      api-mirror-read-2:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/airline_tracker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/static:/usr/share/nginx/html:ro
      - ../README.md:/srv/README.md:ro

  adminer:
    image: adminer:6.1.1-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

