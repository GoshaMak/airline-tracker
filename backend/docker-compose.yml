include:
  - path: ./infra-compose.yml

services:
  api:
    env_file:
      - ./api/.env
    build:
      context: .
      dockerfile: ./api/Dockerfile
    command: ["/bin/api"]
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  api-migrate:
    env_file:
      - ./api/migrate.env
    build:
      context: .
      dockerfile: ./api/Dockerfile
    command: ["/bin/migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  notifier:
    env_file:
      - ./notifier/.env
    build:
      context: .
      dockerfile: ./notifier/Dockerfile
    command: ["/bin/notifier"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      notifier-migrate:
        condition: service_completed_successfully

  notifier-migrate:
    env_file:
      - ./notifier/migrate.env
    build:
      context: .
      dockerfile: ./notifier/Dockerfile
    command: ["/bin/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./static:/usr/share/nginx/html:ro
      - ../README.md:/srv/README.md:ro
      - ./api/cmd/docs/openapi.yaml:/srv/openapi.yaml:ro

  adminer:
    image: adminer:6.1.1-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

