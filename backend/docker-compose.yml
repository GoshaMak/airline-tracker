include:
  - path: ./infra-compose.yml

services:
  api:
    env_file:
      - services/api/.env
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  notifier:
    env_file:
      - ./services/notifier/.env
    build:
      context: .
      dockerfile: ./services/notifier/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
