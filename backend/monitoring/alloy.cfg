discovery.docker "application" {
  host = "unix:///var/run/docker.sock"
  refresh_interval = "5s"
  filter {
    name = "label"
    values = ["airline_tracker.logs=true"]
  }
}

discovery.relabel "application" {
  targets = discovery.docker.application.targets
  rule {
    source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
    target_label = "service"
  }
  rule {
    source_labels = ["__meta_docker_container_label_com_docker_compose_project"]
    target_label = "project"
  }
  rule {
    source_labels = ["__meta_docker_container_name"]
    regex = "/(.*)"
    target_label = "container"
  }
  rule {
    target_label = "app"
    replacement = "airline_tracker"
  }
}

loki.source.docker "application" {
  host = "unix:///var/run/docker.sock"
  targets = discovery.relabel.application.output
  refresh_interval = "5s"
  forward_to = [loki.write.local.receiver]
}

loki.write "local" {
  endpoint {
    url = "http://loki:3100/loki/api/v1/push"
  }
}
