discovery.docker "application" {
  host = "unix:///var/run/docker.sock"
  refresh_interval = "5s"
  filter {
    name = "label"
    values = ["airline_tracker.logs=true"]
  }
}

discovery.relabel "application" {
  targets = discovery.docker.application.targets
  rule {
    source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
    target_label = "service"
  }
  rule {
    source_labels = ["__meta_docker_container_label_com_docker_compose_project"]
    target_label = "project"
  }
  rule {
    source_labels = ["__meta_docker_container_name"]
    regex = "/(.*)"
    target_label = "container"
  }
  rule {
    target_label = "app"
    replacement = "airline_tracker"
  }
  rule {
    source_labels = ["service"]
    regex = "api-publisher(-[23])?|publisher"
    target_label = "app_service"
    replacement = "publisher"
  }
  rule {
    source_labels = ["service"]
    regex = "notifier(-[23])?"
    target_label = "app_service"
    replacement = "notifier"
  }
  rule {
    source_labels = ["service"]
    regex = "api(-(read-[12]|mirror(-read-[12])?))?"
    target_label = "app_service"
    replacement = "api"
  }
}

loki.source.docker "application" {
  host = "unix:///var/run/docker.sock"
  targets = discovery.relabel.application.output
  refresh_interval = "5s"
  forward_to = [loki.write.local.receiver]
}

loki.write "local" {
  endpoint {
    url = "http://loki:3100/loki/api/v1/push"
  }
}

otelcol.receiver.otlp "application" {
  http {
    endpoint = "0.0.0.0:4318"
  }
  output {
    traces = [otelcol.processor.batch.application.input]
  }
}

otelcol.processor.batch "application" {
  timeout = "1s"
  output {
    traces = [otelcol.exporter.otlphttp.tempo.input]
  }
}

otelcol.exporter.otlphttp "tempo" {
  client {
    endpoint = "http://tempo:4318"
    timeout = "5s"
  }
  retry_on_failure {
    max_elapsed_time = "30s"
  }
}
