include:
  - path: ./docker-infra.yml

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./cmd
          target: /app/cmd
        - action: sync+restart
          path: ./internal
          target: /app/internal
        - action: sync+restart
          path: ./pkg
          target: /app/pkg
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum

  data_generator:
    build:
      context: .
      dockerfile: Dockerfile.data_generator
    environment:
      POSTGRES_DB: airline_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./utils/gen_data.py
          target: /utils
        - action: rebuild
          path:  ./requirements.txt
