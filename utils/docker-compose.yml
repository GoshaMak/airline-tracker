services:
  data_generator:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["gen_data.py"]
    environment:
      POSTGRES_DB: airline_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    networks:
      - shared

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate.py"]
    environment:
      POSTGRES_DB: airline_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: mongo
      MONGO_PASSWORD: mongo 
      MONGO_NAME: airline_tracker
    networks:
      - shared

networks:
  shared:
    external: true
    name: shared_postgres
