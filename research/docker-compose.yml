services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: airline_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/db/research/:/docker-entrypoint-initdb.d
    networks:
      - shared
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airline_tracker"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s

  # data_generator:
  #   env_file:
