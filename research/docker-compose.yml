  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: 5432
  #   networks:
  #     - shared
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  researcher:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRE_USER: postgres
      POSTGRE_PASSWORD: postgres
      POSTGRE_HOST: postgres
      POSTGRE_PORT: 5432
      POSTGRE_NAME: airline_tracker
    volumes:
      - ./res/flights.txt:/researcher/res/flights.txt
      # - ./res/flights_idx.txt:/researcher/res/flights_idx.txt
      - ./res/flights_b.txt:/researcher/res/flights_b.txt
      - ./res/flights_h.txt:/researcher/res/flights_h.txt
    depends_on:
      postgres:
        condition: service_healthy
      # data_generator:
      #   condition: service_completed_successfully

volumes:
  postgres_data:
    driver: local

networks:
  shared:
    name: shared_postgres
